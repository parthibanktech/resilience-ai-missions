services:
  # 🧠 Python Backend (FastAPI + LangGraph)
  - type: web
    name: resilience-ai-backend
    env: python
    plan: free
    region: ohio
    rootDir: app/backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONPATH
        value: "."
      - key: OPENAI_API_KEY
        generateValue: true

  # 💻 React Frontend (Vite)
  - type: static
    name: resilience-ai-frontend
    plan: free
    region: ohio
    rootDir: app/frontend
    buildCommand: "npm install && npm run build"
    publishPath: "app/frontend/dist"
    envVars:
      - key: VITE_API_URL
        value: "https://resilience-ai-backend.onrender.com"
