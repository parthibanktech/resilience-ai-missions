services:
  # 🧠 Python Backend
  - type: web
    name: resilience-ai-backend
    env: python
    plan: free
    region: ohio
    rootDir: app/backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONPATH
        value: "."
      - key: OPENAI_API_KEY
        sync: false

  # 💻 React Frontend
  - type: web
    name: resilience-ai-frontend
    env: static
    region: ohio
    buildCommand: "cd app/frontend && npm install && npm run build"
    publishPath: "app/frontend/dist"
    envVars:
      - key: VITE_API_URL
        value: "https://resilience-ai-backend.onrender.com"
