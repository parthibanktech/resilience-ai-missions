[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mission7"
version = "0.1.0"
description = "Mission 7: Self-healing agents with LangGraph"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2.14,<2.0.0",
    "langchain-openai>=1.1.12,<2.0.0",
    "langchain-community>=0.4.1,<1.0.0",
    "langgraph>=1.1.6,<2.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "requests>=2.33.1,<3.0.0",
]

[tool.uv]
package = false
